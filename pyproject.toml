[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "e8checker"
version = "0.2.0"
description = "Assess a Windows endpoint against the ASD Essential Eight (Maturity Level One, with opt-in Level Two readiness), with NIST CSF 2.0 and ISO 27001 mappings"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Hrithik Kumar Chorwar" }]
requires-python = ">=3.10"
dependencies = []
keywords = ["essential eight", "asd", "cyber security", "compliance", "nist csf", "iso 27001", "windows hardening"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Security",
    "Intended Audience :: System Administrators",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
e8checker = "e8checker.cli:main"

[tool.setuptools.packages.find]
include = ["e8checker*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
"e8checker/report/html.py" = ["E501"]  # inline CSS and HTML templates
